<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry - Coming Soon</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            padding: 32px 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(32px, 8vw, 88px);
            font-weight: 700;
            letter-spacing: 0;
        }

        .launch-date {
            margin: 20px 0 36px;
            color: #666666;
            font-size: 14px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: clamp(16px, 5vw, 48px);
            margin: 0;
        }

        .countdown div {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .countdown dt {
            order: 1;
            color: #666666;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .countdown dd {
            margin: 0;
            min-width: 2ch;
            font-size: clamp(28px, 7vw, 56px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .countdown[hidden] {
            display: none;
        }

        body.launched {
            background: #c90000;
            color: #ffffff;
            animation: launch-flash 2s step-end infinite;
        }

        body.launched .launch-date,
        body.launched .countdown dt {
            color: inherit;
        }

        @keyframes launch-flash {
            0%, 100% {
                background: #c90000;
                color: #ffffff;
            }
            50% {
                background: #ffffff;
                color: #c90000;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body.launched {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 id="headline">COMING SOON.</h1>
        <p class="launch-date">
            <time id="launch-date" datetime="2026-11-09T00:00:00-05:00">November 9, 2026 &middot; 12:00 AM EST</time>
        </p>
        <dl class="countdown" aria-label="Time until launch" hidden>
            <div><dt>Days</dt><dd id="days">00</dd></div>
            <div><dt>Hours</dt><dd id="hours">00</dd></div>
            <div><dt>Minutes</dt><dd id="minutes">00</dd></div>
            <div><dt>Seconds</dt><dd id="seconds">00</dd></div>
        </dl>
    </main>
    <script>
        const launchTime = Date.parse(document.getElementById('launch-date').dateTime);
        const countdown = document.querySelector('.countdown');
        const units = ['days', 'hours', 'minutes', 'seconds'].map(id => document.getElementById(id));
        let timer;

        function updateCountdown() {
            const remaining = Math.max(0, Math.ceil((launchTime - Date.now()) / 1000));
            const values = [
                Math.floor(remaining / 86400),
                Math.floor(remaining / 3600) % 24,
                Math.floor(remaining / 60) % 60,
                remaining % 60
            ];

            units.forEach((unit, index) => {
                unit.textContent = String(values[index]).padStart(2, '0');
            });
            countdown.hidden = false;

            if (remaining === 0) {
                document.body.classList.add('launched');
                document.getElementById('headline').textContent = 'THE WAIT IS OVER.';
                clearInterval(timer);
            }
        }

        timer = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
